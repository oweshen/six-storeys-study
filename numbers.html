<style>
:root{
  --ground:#FAF8F5; --panel:#FFFFFF; --ink:#211E19; --muted:#6E675D; --rule:#E4DFD6;
  --accent:#B5541B; --soft:#F3EEE6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191714; --panel:#201D19; --ink:#EAE5DC; --muted:#A39B8D; --rule:#36312A;
    --accent:#E07A3A; --soft:#262220;
  }
}
:root[data-theme="dark"]{
  --ground:#191714; --panel:#201D19; --ink:#EAE5DC; --muted:#A39B8D; --rule:#36312A;
  --accent:#E07A3A; --soft:#262220;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Archivo",-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.55}
.wrap{max-width:660px;margin:0 auto;padding:40px 18px 80px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 22px}
#q{width:100%;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:2rem;font-weight:500;
  padding:18px 20px;border:3px solid var(--ink);border-radius:16px;background:var(--panel);
  color:var(--ink);outline:none;font-feature-settings:"tnum"}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--muted);opacity:.5}
.card{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);
  border-radius:14px;padding:18px 20px;margin-top:16px}
.card .num{font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--accent);letter-spacing:.04em}
.card h2{font-size:1.18rem;font-weight:700;margin:2px 0 10px}
.row{margin:10px 0;font-size:.95rem}
.row b{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.row.say{background:var(--soft);border-radius:10px;padding:10px 12px}
.row code{font-family:"IBM Plex Mono",monospace;font-size:.85em;background:var(--soft);border-radius:4px;padding:1px 5px}
.none{color:var(--muted);margin-top:22px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:.85rem;background:var(--soft);color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:50px;color:var(--muted);font-size:.78rem;border-top:1px solid var(--rule);padding-top:12px}
</style>
<div class="wrap">
<h1>What's That Number</h1>
<p class="sub">Type any number from our project. Four answers, instantly: what exactly it is, exactly where it came from, what it told us — and the exact sentence to say if a marker asks.</p>
<input id="q" placeholder="e.g. 3.63" autocomplete="off" inputmode="decimal" aria-label="Type a number">
<div id="out"></div>
<footer>CR4C Group 2 · OENG1068 six-storey building · every value matches the submitted reports.</footer>
</div>

const q=document.getElementById('q'),out=document.getElementById('out');
const EX=["3.63","177.84","60.9","1451.5","810","0.055","4.5","0.44","26.7","56.91"];
function norm(s){return String(s).toLowerCase().replace(/[,\s$]/g,'').replace(/kpa|mpa|knm|kn\/m|kn|kg|mm|m³|m2|m²|%/g,'');}
function card(e){return `<div class="card"><span class="num">${e.t}</span><h2>${e.n}</h2>
<div class="row"><b>What exactly is it</b>${e.s}</div>
<div class="row"><b>Exactly where it came from</b>${e.f}</div>
<div class="row"><b>Exactly what it tells us</b>${e.m}</div>
<div class="row say"><b>If they ask “how did you get this?” — say</b>“${e.a}”</div></div>`;}
function render(){
  const raw=q.value.trim();
  if(!raw){out.innerHTML=`<p class="none">Try one of these:</p><div class="chips">`+
    EX.map(x=>`<button class="chip" onclick="go('${x}')">${x}</button>`).join('')+`</div>`;return;}
  const n=norm(raw);
  let hits=DB.filter(e=>e.k.some(k=>norm(k)===n));
  if(!hits.length)hits=DB.filter(e=>e.k.some(k=>norm(k).startsWith(n)));
  if(!hits.length)hits=DB.filter(e=>e.n.toLowerCase().includes(raw.toLowerCase())||e.s.toLowerCase().includes(raw.toLowerCase())||e.m.toLowerCase().includes(raw.toLowerCase()));
  out.innerHTML=hits.length?hits.slice(0,4).map(card).join(''):
    `<p class="none">Nothing for “${raw}”. Try the number with no units (e.g. 177.84), or a word like “settlement”, “steel”, “clay”.</p>`;
}
function go(s){q.value=s;render();q.focus();}
window.go=go;
q.addEventListener('input',render);
render();
q.focus();
</script>
